name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (version pinned in requirements.lock)
        run: pip install "$(grep '^ruff==' requirements.lock)"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # torch alone comes from the CPU-only index (--no-deps), so the default PyPI
      # build does not drag ~3 GB of CUDA wheels onto the runner and that index
      # cannot supply any other package. torch's own dependencies are resolved
      # from PyPI, pinned, by the next step.
      - name: Install CPU-only torch
        run: |
          pip install --no-deps "$(grep '^torch==' requirements.lock)" \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package with pinned dependencies
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Run tests
        run: pytest -q
